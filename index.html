<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Portfólio - Turmas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f9;
            color: #333;
        }

        header {
            background-color: #0056b3;
            color: white;
            padding: 1rem 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            margin-top: 10px;
        }

        nav button {
            background-color: white;
            color: #0056b3;
            border: 2px solid white;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        nav button:hover {
            background-color: #e6f0ff;
        }

        nav button.active {
            background-color: #003d80;
            color: white;
            border-color: #003d80;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        h2 {
            color: #0056b3;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
        }

        .stats {
            margin-bottom: 20px;
            font-style: italic;
            color: #666;
        }

        .grid-alunos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
        }

        .aluno-card {
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .aluno-info {
            display: flex;
            align-items: center;
            text-transform: uppercase;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .aluno-info::before {
            content: "👤";
            margin-right: 10px;
        }

        .btn-link {
            text-decoration: none;
            background-color: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-link:hover {
            background-color: #218838;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<header>
    <h1>Gestão de Portfólio</h1>
    <nav>
        <button onclick="showTurma('1a', this)" class="active">1°A</button>
        <button onclick="showTurma('1b', this)">1°B</button>
        <button onclick="showTurma('2a', this)">2°A</button>
        <button onclick="showTurma('3a', this)">3°A</button>
    </nav>
</header>

<div class="container">
    <section id="1a" class="turma-section">
        <h2>Turma 1°A</h2>
        <p class="stats" id="stats-1a"></p>
        <div class="grid-alunos" id="lista-1a"></div>
    </section>

    <section id="1b" class="turma-section hidden">
        <h2>Turma 1°B</h2>
        <p class="stats" id="stats-1b"></p>
        <div class="grid-alunos" id="lista-1b"></div>
    </section>

    <section id="2a" class="turma-section hidden">

    <section id="3a" class="turma-section hidden">

</div>

    function generateAlunos() {
        for (const [id, lista] of Object.entries(alunosPorTurma)) {
            const container = document.getElementById(`lista-${id}`);
            const statsContainer = document.getElementById(`stats-${id}`);
            
            if (statsContainer) {
                statsContainer.textContent = `Total: ${lista.length} alunos`;
            }

            lista.forEach(nome => {
                const card = document.createElement('div');
                card.className = 'aluno-card';

                const info = document.createElement('div');
                info.className = 'aluno-info';
                info.textContent = nome;

                const link = document.createElement('a');
                link.className = 'btn-link';
                link.textContent = 'VER PORTFÓLIO';
                link.href = `portfolios/${nome.replace(/\s+/g, '-').toLowerCase()}.html`;
                link.target = "_blank";

                card.appendChild(info);
                card.appendChild(link);
                container.appendChild(card);
            });
        }
    }

    function showTurma(id, btn) {
        document.querySelectorAll('.turma-section').forEach(sec => sec.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    window.onload = generateAlunos;
</script>
